{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4">Completed Tasks</h2>

{% if tasks %}
<ul class="list-group">
{% for task in tasks %}
<li class="list-group-item d-flex justify-content-between align-items-center">
    <div>
        <strong>{{ task.title }}</strong><br>
        <small>{{ task.category }} | {{ task.priority }}</small>
    </div>

    <a href="{{ url_for('toggle', task_id=task.id) }}" class="btn btn-warning btn-sm">
        Mark Pending
    </a>
</li>
{% endfor %}
</ul>
{% else %}
<div class="alert alert-info">
No completed tasks yet.
</div>
{% endif %}

{% endblock %}
