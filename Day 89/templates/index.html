{% extends 'base.html' %}{% block content %}<h2 class="mb-3">My Tasks</h2><table class="table table-hover"><thead><tr><th>Title</th><th>Priority</th><th>Category</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead><tbody>{% for task in tasks %}<tr><td>{{task.title}}</td><td>{{task.priority}}</td><td>{{task.category}}</td><td>{{task.due_date}}</td><td>{% if task.completed %}<span class="badge bg-success">Completed</span>{% else %}<span class="badge bg-warning text-dark">Pending</span>{% endif %}</td><td><a class="btn btn-sm btn-primary" href="{{ url_for('edit_task',task_id=task.id) }}">Edit</a> <a class="btn btn-sm btn-secondary" href="{{ url_for('toggle',task_id=task.id) }}">Toggle</a> <a class="btn btn-sm btn-danger" href="{{ url_for('delete',task_id=task.id) }}">Delete</a></td></tr>{% endfor %}</tbody></table>{% endblock %}
