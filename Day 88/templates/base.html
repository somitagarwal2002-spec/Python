<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cafe Finder</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href='{{ url_for("static", filename="css/styles.css") }}'
    />
  </head>
  <body>
    {% include 'navbar.html' %}
    <div class="container py-4">
      {% with messages=get_flashed_messages(with_categories=true) %}{% for c,m
      in messages %}
      <div class="alert alert-{{c}}">{{m}}</div>
      {% endfor %}{% endwith %}{% block content %}{% endblock %}
    </div>
    {% include 'footer.html' %}
  </body>
</html>
