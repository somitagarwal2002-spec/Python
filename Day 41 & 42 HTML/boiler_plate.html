<!DOCTYPE html> <!-- it tells the browser which version of HTML the file was written in  -->
<html lang="en"> <!-- Language of the text content in the element -->
<head> <!-- important information about the website i.e not going to display to the user -->
    <meta charset="UTF-8"> <!-- ensures the character that you're using on your websites gets displayed correctly like some emojis, etc. -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!-- keeps our code compatible with the internet explorer -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- how the website should be displayed relative to the screen it's been rendered on -->
    <title>Document</title> <!-- Name written in the tab section area -->
</head>
<body>
    <!-- content of the website is present here all tags, contents, images, links, etc. -->
    <h1>Hello World!</h1>
</body>
</html>
