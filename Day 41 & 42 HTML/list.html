<!-- List are of 2 types ordered (includes number, alphanumeric, roman, etc.) and unordered (includes bullet points, etc.) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h2>Unordered List</h2>
    <ul>
        <li>Milk</li>
        <li>Eggs</li>
        <li>Flour</li>
    </ul>
    <h2>Ordered List</h2>
    <ol>
        <li>Milk</li>
        <li>Eggs</li>
        <li>Flour</li>
    </ol>
</body>
</html>
